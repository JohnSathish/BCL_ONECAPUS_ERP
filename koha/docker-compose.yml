# Standalone Koha ILS for Don Bosco College Tura.
# Own compose project, own MySQL, own network. No ERP services, env, or docker network.
# OPAC 8080 / staff 8081 published only on loopback.

name: dbc-koha

services:
  db:
    image: docker.io/mysql:8.0
    container_name: koha-db
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${KOHA_DB_ROOT_PASSWORD:?set KOHA_DB_ROOT_PASSWORD in koha/.env}
      MYSQL_DATABASE: ${KOHA_DB_NAME:-koha_library}
      MYSQL_USER: ${KOHA_DB_USER:-koha_library}
      MYSQL_PASSWORD: ${KOHA_DB_PASSWORD:?set KOHA_DB_PASSWORD in koha/.env}
    volumes:
      - koha-mysql:/var/lib/mysql
      - ./backups:/backups:ro
    networks:
      - koha
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1']
      interval: 10s
      timeout: 5s
      retries: 20

  memcached:
    image: docker.io/memcached:1.6-alpine
    container_name: koha-memcached
    restart: unless-stopped
    command: memcached -m 64m
    networks:
      - koha

  rabbitmq:
    image: docker.io/rabbitmq:3
    container_name: koha-rabbitmq
    restart: unless-stopped
    volumes:
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    networks:
      - koha

  koha:
    # Hub publishes 24.11 / latest, not 23.11. Restore the 23.11 dump; Koha upgrades the schema.
    image: docker.io/teogramm/koha:${KOHA_IMAGE_TAG:-24.11}
    container_name: koha-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      memcached:
        condition: service_started
      rabbitmq:
        condition: service_started
    environment:
      MYSQL_SERVER: db
      DB_NAME: ${KOHA_DB_NAME:-koha_library}
      MYSQL_USER: ${KOHA_DB_USER:-koha_library}
      MYSQL_PASSWORD: ${KOHA_DB_PASSWORD:?set KOHA_DB_PASSWORD in koha/.env}
      MEMCACHED_SERVERS: memcached:11211
      MB_HOST: rabbitmq
      ZEBRA_MARC_FORMAT: marc21
      KOHA_LANGS: ${KOHA_LANGS:-}
    cap_add:
      - DAC_READ_SEARCH
      - SYS_NICE
    # Loopback only for host-side curl/debug. Public HTTPS goes ERP nginx →
    # koha_nginx_edge → koha-web:8080 (see vps-attach-koha-nginx.sh).
    # Do not recreate this container with --force-recreate (wipes /etc/koha/sites).
    ports:
      - '127.0.0.1:16080:8080'
      - '127.0.0.1:16081:8081'
    volumes:
      - ./opac-custom:/usr/share/koha/opac/htdocs/opac-custom:ro
      - ./opac-custom:/usr/share/koha/intranet/htdocs/staff-custom:ro
    networks:
      - koha

  # Omkar In/Out gate register — reads Koha patrons, own visit tables. Not ERP Library I/O.
  inout:
    build:
      context: ./inout
    image: dbc-koha-inout:v6
    pull_policy: never
    container_name: koha-inout
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      inout-db-init:
        condition: service_completed_successfully
    environment:
      INOUT_DB_HOST: db
      INOUT_DB_NAME: ${INOUT_DB_NAME:-koha_inout}
      KOHA_DB_NAME: ${KOHA_DB_NAME:-koha_library}
      KOHA_DB_USER: ${KOHA_DB_USER:-koha_library}
      KOHA_DB_PASSWORD: ${KOHA_DB_PASSWORD:?set KOHA_DB_PASSWORD in koha/.env}
    ports:
      - '127.0.0.1:16082:80'
    volumes:
      - ./inout/overlay/dash.php:/var/www/html/dash.php:ro
      - ./inout/overlay/login.php:/var/www/html/login.php:ro
      - ./inout/overlay/main.php:/var/www/html/process/operations/main.php:ro
      - ./inout/overlay/stats.php:/var/www/html/process/operations/stats.php:ro
      - ./inout/overlay/dbc-inout.css:/var/www/html/assets/css/dbc-inout.css:ro
      - ./inout/overlay/dbc-login.css:/var/www/html/assets/css/dbc-login.css:ro
      - ./inout/overlay/dbc-logo.png:/var/www/html/assets/img/dbc-logo.png:ro
      - ./inout/overlay/dbc-crest.png:/var/www/html/assets/img/dbc-crest.png:ro
      - ./inout/overlay/campus.jpg:/var/www/html/assets/img/campus.jpg:ro
      - ./inout/overlay/don-bosco.png:/var/www/html/assets/img/don-bosco.png:ro
    networks:
      - koha

  inout-db-init:
    image: docker.io/mysql:8.0
    container_name: koha-inout-db-init
    depends_on:
      db:
        condition: service_healthy
    environment:
      INOUT_DB_HOST: db
      INOUT_DB_NAME: ${INOUT_DB_NAME:-koha_inout}
      KOHA_DB_NAME: ${KOHA_DB_NAME:-koha_library}
      KOHA_DB_USER: ${KOHA_DB_USER:-koha_library}
      KOHA_DB_ROOT_PASSWORD: ${KOHA_DB_ROOT_PASSWORD:?set KOHA_DB_ROOT_PASSWORD in koha/.env}
    volumes:
      - ./inout/schema.sql:/schema.sql:ro
      - ./inout/init-db.sh:/init-db.sh:ro
    entrypoint:
      [
        'bash',
        '-c',
        'cp /init-db.sh /tmp/init-db.sh && sed -i "s/\\r$//" /tmp/init-db.sh && bash /tmp/init-db.sh',
      ]
    networks:
      - koha
    restart: 'no'

networks:
  koha:
    name: koha_internal

volumes:
  koha-mysql:
