name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-quality:
    name: API — lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Typecheck
        run: npm run typecheck -w api

      - name: Unit tests
        run: npm run test:ci -w api

  worker-quality:
    name: Worker — lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: ESLint
        run: npm run lint:ci -w worker

      - name: Typecheck
        run: npm run typecheck -w worker

  web-quality:
    name: Web — typecheck (baseline gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck web
        run: npm run typecheck -w web 2>&1 | tee typecheck-web.log

      - name: Enforce typecheck baseline
        run: node scripts/ci/web-typecheck-gate.mjs typecheck-web.log

      - name: Upload typecheck log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-typecheck-log
          path: typecheck-web.log
          retention-days: 7

  web-lint:
    name: Web — ESLint
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint (informational)
        run: npm run lint -w web

  college-web-quality:
    name: College website — lint, typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint -w @onecampus/college-web

      - name: Typecheck
        run: npm run typecheck -w @onecampus/college-web

      - name: Build
        run: npm run build -w @onecampus/college-web

  build:
    name: Production build
    needs: [api-quality, worker-quality, web-quality, college-web-quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Build
        run: npm run build

  web-e2e:
    name: Web — Playwright RBAC & axe
    runs-on: ubuntu-latest
    needs: [web-quality]
    # Gate hard when restricted credentials are configured; otherwise run login a11y only and allow skip.
    continue-on-error: ${{ secrets.E2E_RESTRICTED_EMAIL == '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Run e2e (RBAC + axe)
        working-directory: apps/web
        env:
          PLAYWRIGHT_BASE_URL: ${{ secrets.PLAYWRIGHT_BASE_URL }}
          E2E_RESTRICTED_EMAIL: ${{ secrets.E2E_RESTRICTED_EMAIL }}
          E2E_RESTRICTED_PASSWORD: ${{ secrets.E2E_RESTRICTED_PASSWORD }}
          E2E_DENIED_PATH: ${{ secrets.E2E_DENIED_PATH }}
          E2E_A11Y_PATH: ${{ secrets.E2E_A11Y_PATH }}
        run: |
          export PLAYWRIGHT_BASE_URL="${PLAYWRIGHT_BASE_URL:-https://erp.donboscocollege.ac.in}"
          npx playwright test

  college-web-e2e:
    name: College website — Playwright & axe
    runs-on: ubuntu-latest
    needs: [college-web-quality]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: apps/college-web

      - name: Run public website e2e
        run: npm run test:e2e
        working-directory: apps/college-web
